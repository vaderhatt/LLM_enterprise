---
- name: Configure AD UI Kubernetes secret
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_path: "{{ playbook_dir }}/kubeconfig"
    ad_ui_namespace: ad-ui
    ad_ui_secret_name: ad-ui-secrets
    samba_admin_password_file: "{{ lookup('env', 'SAMBA_ADMIN_PASSWORD_FILE') | default(playbook_dir ~ '/../.secrets/samba-admin-password', true) }}"
    lam_password_file: "{{ lookup('env', 'LAM_PASSWORD_FILE') | default(playbook_dir ~ '/../.secrets/lam-password', true) }}"
    ldap_admin_dn: CN=Administrator,CN=Users,DC=ad,DC=w237,DC=local

  tasks:
    - name: Check kubeconfig exists
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: ad_ui_kubeconfig

    - name: Fail when kubeconfig is missing
      ansible.builtin.fail:
        msg: "Kubeconfig not found at {{ kubeconfig_path }}. Deploy RKE2 and fetch kubeconfig first."
      when: not ad_ui_kubeconfig.stat.exists

    - name: Create local secrets directory
      ansible.builtin.file:
        path: "{{ lam_password_file | dirname }}"
        state: directory
        mode: "0700"

    - name: Check Samba Administrator password file exists
      ansible.builtin.stat:
        path: "{{ samba_admin_password_file }}"
      register: ad_ui_samba_password

    - name: Generate Samba Administrator password
      ansible.builtin.command:
        cmd: openssl rand -base64 24
      register: ad_ui_generated_samba_password
      changed_when: true
      no_log: true
      when: not ad_ui_samba_password.stat.exists

    - name: Store generated Samba Administrator password
      ansible.builtin.copy:
        dest: "{{ samba_admin_password_file }}"
        content: "{{ ad_ui_generated_samba_password.stdout }}\n"
        mode: "0600"
      no_log: true
      when: not ad_ui_samba_password.stat.exists

    - name: Check LAM profile password file exists
      ansible.builtin.stat:
        path: "{{ lam_password_file }}"
      register: ad_ui_lam_password

    - name: Generate LAM profile password
      ansible.builtin.command:
        cmd: openssl rand -base64 24
      register: ad_ui_generated_lam_password
      changed_when: true
      no_log: true
      when: not ad_ui_lam_password.stat.exists

    - name: Store generated LAM profile password
      ansible.builtin.copy:
        dest: "{{ lam_password_file }}"
        content: "{{ ad_ui_generated_lam_password.stdout }}\n"
        mode: "0600"
      no_log: true
      when: not ad_ui_lam_password.stat.exists

    - name: Create AD UI namespace
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig_path }} create namespace {{ ad_ui_namespace }} --dry-run=client -o yaml"
      register: ad_ui_namespace_manifest
      changed_when: false

    - name: Apply AD UI namespace
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig_path }} apply -f -"
        stdin: "{{ ad_ui_namespace_manifest.stdout }}"
      register: ad_ui_namespace_apply
      changed_when: "'created' in ad_ui_namespace_apply.stdout or 'configured' in ad_ui_namespace_apply.stdout"

    - name: Create AD UI secret manifest
      ansible.builtin.shell: >-
        kubectl --kubeconfig {{ kubeconfig_path }} -n {{ ad_ui_namespace }} create secret generic {{ ad_ui_secret_name }}
        --from-file=lam-password={{ lam_password_file }}
        --from-literal=ldap-user='{{ ldap_admin_dn }}'
        --from-file=ldap-password={{ samba_admin_password_file }}
        --dry-run=client -o yaml
      register: ad_ui_secret_manifest
      changed_when: false
      no_log: true

    - name: Apply AD UI secret
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig_path }} apply -f -"
        stdin: "{{ ad_ui_secret_manifest.stdout }}"
      register: ad_ui_secret_apply
      changed_when: "'created' in ad_ui_secret_apply.stdout or 'configured' in ad_ui_secret_apply.stdout"
      no_log: true

    - name: Show AD UI secret status
      ansible.builtin.debug:
        msg: "Secret {{ ad_ui_namespace }}/{{ ad_ui_secret_name }} is present. LAM profile password file: {{ lam_password_file }}"