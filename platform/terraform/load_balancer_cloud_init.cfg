#cloud-config
hostname: ${hostname}
users:
  - name: ${ansible_user}
    groups: sudo
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
package_update: true
package_upgrade: true
packages:
  - openssh-server
  - curl
  - haproxy
write_files:
  - path: /etc/haproxy/haproxy.cfg
    owner: root:root
    permissions: '0644'
    content: |
${haproxy_config}
runcmd:
  - systemctl enable ssh
  - systemctl start ssh
  - systemctl enable haproxy
  - systemctl restart haproxy