apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-node-exporter
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-node-exporter
      version: 4.55.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    fullnameOverride: prometheus-node-exporter
    service:
      port: 9100
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi