apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://10.10.1.40:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        namespace: external-secrets
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets-vault-auth
            namespace: external-secrets